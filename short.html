<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Short do martelo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="720" height="1280"></canvas>
<script src="ficha.js"></script>
<script>
// ===== Short motivacional 16 s — cada quadro é função pura do tempo: window.seek(t) =====
const W = 720, H = 1280, GY = 880, DUR = 16, FPS = 30;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const F = window.FICHA;

// ---------- utilidades ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, s) => a + (b - a) * s;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eo = x => 1 - Math.pow(1 - x, 3);
const ein = x => x * x * x;
const D = Math.PI / 180;
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, s) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], s))).join(',')})`; };
const rot = (x, y, r) => [x * Math.cos(r) - y * Math.sin(r), x * Math.sin(r) + y * Math.cos(r)];

// ---------- rolagem: integral da curva de velocidade (passos de 1 ms) ----------
function speed(t) {
  if (t < 6.2) return 400;
  if (t < 6.55) return 400 * (1 - eio(seg(t, 6.2, 6.55)));
  if (t < 10.45) return 0;
  if (t < 10.85) return 460 * eio(seg(t, 10.45, 10.85));
  if (t < 11.9) return 460;
  if (t < 12.5) return 460 * (1 - eio(seg(t, 11.9, 12.5)));
  return 0;
}
const SX = new Float64Array(17001);
for (let i = 1; i < SX.length; i++) SX[i] = SX[i - 1] + speed((i - .5) / 1000) / 1000;
const X = t => { const f = clamp(t, 0, 17) * 1000, i = Math.floor(f); return i >= 17000 ? SX[17000] : lerp(SX[i], SX[i + 1], f - i); };

// ---------- corpo (esqueleto) ----------
const HITS = [0.5, 2.5, 4.5];
const springs = [[0.64, .07], [2.64, .07], [4.64, .07], [6.6, .05], [7.35, .1], [8.55, .05], [9.9, .06]];
function squash(t) { let s = 0; for (const [t0, a] of springs) { const d = t - t0; if (d >= 0 && d < 1.2) s += a * Math.exp(-.45 * 14 * d) * Math.cos(14 * Math.sqrt(1 - .45 * .45) * d); } return 1 - s; }
function hipX(t) {
  if (t < 6.82) return 215;
  if (t < 7.35) return lerp(215, 140, eio(seg(t, 6.82, 7.35)));
  if (t < 8.55) return 140;
  if (t < 9.05) return lerp(140, 300, eio(seg(t, 8.55, 9.05)));
  if (t < 10.45) return 300;
  if (t < 11.4) return lerp(300, 215, eio(seg(t, 10.45, 11.4)));
  return 215;
}
function runLegs(phi, amp) {
  return [0, 1].map(i => { const p = phi + i * Math.PI; return { a: 0.62 * amp * Math.sin(p), k: 0.2 * amp + amp * (0.15 + 0.85 * Math.max(0, Math.cos(p))) }; });
}
function body(t) {
  const sp = speed(t), X0 = X(t);
  let hx = hipX(t), hy = 772, R = 0.12, legs;
  const amp = clamp(sp / 400, 0, 1.15);
  const phi = Math.PI * X0 / 170;
  if (t < 6.82 || t >= 10.45) {
    const a = Math.max(amp, t >= 10.45 && t < 11.4 ? .5 : 0);
    if (a > .03) { legs = runLegs(phi + (t >= 10.45 ? (300 - hx) / 90 * Math.PI : 0), a); hy = 772 - 10 * Math.abs(Math.sin(phi)) * a; }
    else legs = [{ a: .07, k: .1 }, { a: -.07, k: .1 }];
    R = lerp(0.04, 0.12, clamp(a));
    for (const h of HITS) { const s = seg(t, h - .30, h + .14); if (s > 0 && s < 1) { const j = Math.sin(Math.PI * s); hy -= 42 * j; legs = legs.map(l => ({ a: lerp(l.a, .95, j), k: lerp(l.k, 1.75, j) })); R = lerp(R, .2, j); } }
    if (t >= 6.3 && t < 6.82) { legs = [{ a: .28, k: .18 }, { a: -.32, k: .12 }]; R = .14; }
    if (t >= 12.5) { const s = eio(seg(t, 12.5, 12.9)); legs = [{ a: .12, k: .08 }, { a: -.12, k: .08 }]; R = lerp(.08, -.02, s); hy = 772 + (t > 13 ? 3 * Math.sin((t - 13) * 2 * Math.PI * .9) : 0); }
  } else if (t < 7.35) {
    const f = eio(seg(t, 6.82, 7.35));
    R = lerp(.14, -Math.PI / 2, f); hy = lerp(772, 864, f) - 46 * Math.sin(Math.PI * f);
    legs = [{ a: lerp(.28, .35, f), k: lerp(.18, .5, f) }, { a: lerp(-.32, .2, f), k: lerp(.12, .35, f) }];
  } else if (t < 7.9) {
    R = -Math.PI / 2; hy = 864; legs = [{ a: .35, k: .5 }, { a: .2, k: .35 }];
  } else if (t < 8.25) {
    const s = eio(seg(t, 7.9, 8.25));
    R = lerp(-Math.PI / 2, -.12, s); hy = 866;
    legs = [{ a: lerp(.35, 1.45, s), k: lerp(.5, .3, s) }, { a: lerp(.2, 1.4, s), k: lerp(.35, .15, s) }];
  } else if (t < 8.55) {
    const s1 = eio(seg(t, 8.25, 8.4)), s2 = eio(seg(t, 8.4, 8.55));
    R = lerp(lerp(-.12, .35, s1), .12, s2); hy = lerp(lerp(866, 818, s1), 772, s2);
    legs = [{ a: lerp(lerp(1.45, 1.05, s1), .06, s2), k: lerp(lerp(.3, 1.9, s1), .1, s2) }, { a: lerp(lerp(1.4, .9, s1), -.06, s2), k: lerp(lerp(.15, 1.7, s1), .1, s2) }];
  } else if (t < 9.05) {
    const s = seg(t, 8.55, 9.05), p = (hx - 140) / 80 * Math.PI;
    legs = runLegs(p, .5 * Math.sin(Math.PI * s) + .05); hy = 772 - 5 * Math.abs(Math.sin(p)); R = .16;
    if (s > .8) { const b = (s - .8) / .2; legs = legs.map((l, i) => ({ a: lerp(l.a, i ? -.38 : .28, b), k: lerp(l.k, .15, b) })); }
  } else {
    R = .2; legs = [{ a: .28, k: .15 }, { a: -.38, k: .15 }];
    if (t < 9.9) { hy += Math.sin(t * 90) * 1.2; }
  }
  const sq = squash(t);
  return { hx, hy, R, legs, sq };
}
const shoulderOf = b => { const [x, y] = rot(0, -104, b.R); return [b.hx + x, b.hy + y * b.sq]; };

// ---------- martelo: pose = mão relativa ao ombro + ângulo, ou alvo da cabeça ----------
const HL = 94; // da mão ao centro da cabeça
const CARRY = { rel: [26, -26], A: -168 * D };
const UP = { rel: [6, -98], A: -90 * D };
const WIND = { rel: [-10, -94], A: -122 * D };
const C4 = [356, 520];      // ponto do martelo no canto rachado do muro 4
const CRACK = [376, 520];   // centro das rachaduras (borda do muro)
function resolve(p, S, b) {
  if (p.head) { const dx = p.head[0] - S[0], dy = p.head[1] - S[1]; const A = Math.atan2(dy, dx); return { rel: [dx - Math.cos(A) * HL, dy - Math.sin(A) * HL], A }; }
  if (p.abs) return { rel: [p.abs[0] - S[0], p.abs[1] - S[1]], A: p.A };
  return p;
}
function blendP(p, q, s, S, b) { const a = resolve(p, S, b), c = resolve(q, S, b); return { rel: [lerp(a.rel[0], c.rel[0], s), lerp(a.rel[1], c.rel[1], s)], A: lerp(a.A, c.A, s) }; }
let STRIKE = [];
function hammerPose(t, b, S) {
  for (let i = 0; i < 3; i++) {
    const h = HITS[i], ST = STRIKE[i];
    if (!ST) break;
    if (t >= h - .36 && t < h + .48) {
      if (t < h - .24) return blendP(CARRY, WIND, eo(seg(t, h - .36, h - .24)), S, b);
      if (t < h - .07) return blendP(WIND, { rel: [-16, -92], A: -128 * D }, seg(t, h - .24, h - .07), S, b);
      if (t < h) return blendP({ rel: [-16, -92], A: -128 * D }, ST, ein(seg(t, h - .07, h)), S, b);
      if (t < h + .1) return resolve(ST, S, b);
      return blendP(ST, CARRY, eio(seg(t, h + .1, h + .48)), S, b);
    }
  }
  const LIE = { abs: [S[0] + 84, 868], A: -90 * D };
  const FRONT = { rel: [42, -8], A: -72 * D };
  if (t < 6.3) return CARRY;
  if (t < 6.45) return blendP(CARRY, UP, eio(seg(t, 6.3, 6.45)), S, b);
  if (t < 6.58) return UP;
  if (t < 6.6) return blendP(UP, { head: C4 }, ein(seg(t, 6.58, 6.6)), S, b);
  if (t < 6.82) { const r = Math.sin(seg(t, 6.6, 6.82) * Math.PI) * 8; return resolve({ head: [C4[0] - r, C4[1] + r * .3] }, S, b); }
  if (t < 7.35) return blendP({ head: C4 }, LIE, eio(seg(t, 6.82, 7.35)), S, b);
  if (t < 7.9) return resolve(LIE, S, b);
  if (t < 8.25) return blendP(LIE, FRONT, eio(seg(t, 7.9, 8.25)), S, b);
  if (t < 8.6) return FRONT;
  if (t < 9.05) return blendP(FRONT, { head: C4 }, eio(seg(t, 8.6, 9.05)), S, b);
  if (t < 9.9) { const j = Math.sin(t * 80) * 1.5; return resolve({ head: [C4[0] + j, C4[1] - j] }, S, b); }
  if (t < 10.45) return resolve({ head: [C4[0] + 14 * eo(seg(t, 9.9, 10.05)), C4[1]] }, S, b);
  if (t < 10.85) return blendP({ head: [C4[0] + 14, C4[1]] }, CARRY, eio(seg(t, 10.45, 10.85)), S, b);
  if (t < 12.6) return CARRY;
  return blendP(CARRY, UP, eio(seg(t, 12.6, 13.0)), S, b);
}
function figure(t) {
  const b = body(t), S = shoulderOf(b), p = hammerPose(t, b, S);
  const G = [S[0] + p.rel[0], S[1] + p.rel[1]], dir = [Math.cos(p.A), Math.sin(p.A)];
  return { b, S, G, A: p.A, dir, head: [G[0] + dir[0] * HL, G[1] + dir[1] * HL] };
}

// ---------- muros (posicionados no mundo para o martelo bater na borda de cima no quadro do golpe) ----------
const WALLS = [
  { type: 'wood', w: 140, h: 190 }, { type: 'brick', w: 140, h: 222 },
  { type: 'glass', w: 150, h: 242 }, { type: 'slab', w: 186, h: 416 }];
for (let i = 0; i < 3; i++) {
  const h = HITS[i], b = body(h), S = shoulderOf(b), wl = WALLS[i];
  const reach = 70, L = reach + HL, Ty = GY - wl.h - 22, dy = Ty - S[1];
  const dx = Math.sqrt(Math.max(0, L * L - dy * dy));
  STRIKE[i] = { head: [S[0] + dx, Ty] };
  wl.wx = S[0] + dx - 24 + X(h); wl.hit = h;
}
WALLS[3].wx = 376 + X(6.55);
const FLAGX = 374 + X(12.5);

// ---------- fundo ----------
const SKY = [
  [0, ['#020305', '#04050a', '#0a0c15']], [5.5, ['#06071a', '#0b0c22', '#241c34']], [8.6, ['#06071a', '#0b0c22', '#241c34']],
  [9.3, ['#16223d', '#1d2c4b', '#26375a']], [10.3, ['#16223d', '#1d2c4b', '#26375a']], [11.2, ['#0b1028', '#10162f', '#1b1a32']],
  [12.6, ['#0b1028', '#10162f', '#1b1a32']], [14, ['#1a1f46', '#3d3760', '#8a5c50']]];
const FAR = [[0, '#0c0f19'], [8.6, '#0c0f19'], [9.3, '#1a2440'], [10.3, '#1a2440'], [11.2, '#0c0f19'], [12.6, '#0c0f19'], [14, '#121d24']];
const NEAR = [[0, '#06070c'], [8.6, '#06070c'], [9.3, '#0e1424'], [10.3, '#0e1424'], [11.2, '#06070c'], [12.6, '#06070c'], [14, '#0a1214']];
function key(K, t) {
  if (t <= K[0][0]) return K[0][1];
  for (let i = 0; i < K.length - 1; i++) {
    const [a, A] = K[i], [b, B] = K[i + 1];
    if (t < b) { const s = eio(seg(t, a, b)); return Array.isArray(A) ? A.map((c, j) => mix(c, B[j], s)) : mix(A, B, s); }
  }
  const L = K[K.length - 1][1]; return Array.isArray(L) ? L.map(c => mix(c, c, 0)) : mix(L, L, 0);
}
const R0 = rng(7);
const STARS = Array.from({ length: 140 }, () => ({ x: R0() * 900, y: R0() * 640 + 10, r: .7 + R0() * 1.3, a: .25 + R0() * .35, f: .4 + R0() * 1.2, p: R0() * 6.3 }));
// cordilheira suave: picos e vales alternados, ligados por curvas quadráticas com tangente horizontal
function peaks(seed, hmin, hmax, wmin, wmax) { const r = rng(seed), P = []; let x = -400, up = true; while (x < 5400) { const w = wmin + r() * (wmax - wmin); P.push({ x, y: up ? GY - (hmin + r() * (hmax - hmin)) : GY - hmin * (.45 + r() * .25) }); x += w / 2; up = !up; } return P; }
const FARP = peaks(11, 330, 410, 330, 470), NEARP = peaks(23, 150, 230, 240, 360);
function mountains(P, par, t, col) {
  const off = X(t) * par;
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-60, GY + 2);
  let first = true;
  for (let i = 0; i < P.length - 1; i++) {
    const a = P[i], b = P[i + 1], ax = a.x - off, bx = b.x - off;
    if (bx < -200 || ax > W + 200) continue;
    if (first) { ctx.lineTo(ax, a.y); first = false; }
    const mx = (ax + bx) / 2, my = (a.y + b.y) / 2;
    ctx.quadraticCurveTo(ax + (mx - ax) * .9, a.y, mx, my); ctx.quadraticCurveTo(bx - (bx - mx) * .9, b.y, bx, b.y);
  }
  ctx.lineTo(W + 60, GY + 2); ctx.closePath(); ctx.fill();
}
const RG = rng(31);
const TUFTS = Array.from({ length: 160 }, (_, i) => ({ x: i * 36 + RG() * 20, h: 5 + RG() * 9, n: 2 + Math.floor(RG() * 3) }));
const PEBS = Array.from({ length: 260 }, (_, i) => ({ x: i * 22 + RG() * 14, y: GY + 6 + RG() * 10, r: 1.5 + RG() * 2.5, g: 70 + RG() * 40 }));
const SPOTS = Array.from({ length: 220 }, () => ({ x: RG() * 5800, y: GY + 20 + RG() * 330, rx: 6 + RG() * 22, ry: 2 + RG() * 5 }));
function dawn(t) { return eio(seg(t, 12.6, 14)); }
function background(t) {
  const s = key(SKY, t), g = ctx.createLinearGradient(0, 0, 0, GY);
  g.addColorStop(0, s[0]); g.addColorStop(.6, s[1]); g.addColorStop(1, s[2]);
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, GY + 40);
  const sf = 1 - dawn(t), off = X(t) * .05;
  if (sf > 0) for (const st of STARS) {
    const x = ((st.x - off) % 900 + 900) % 900 - 90; if (x < -5 || x > W + 5) continue;
    ctx.globalAlpha = st.a * (.65 + .35 * Math.sin(t * st.f + st.p)) * sf;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, st.y, st.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const d = dawn(t);
  if (d > 0) {
    const sy = lerp(640, 346, d);
    const hg = ctx.createRadialGradient(466, sy, 10, 466, sy, 330);
    hg.addColorStop(0, `rgba(255,196,130,${.42 * d})`); hg.addColorStop(1, 'rgba(255,170,110,0)');
    ctx.fillStyle = hg; ctx.fillRect(0, 0, W, GY);
    ctx.fillStyle = '#f8dc9c'; ctx.beginPath(); ctx.arc(466, sy, 44, 0, 7); ctx.fill();
  }
  mountains(FARP, .12, t, key(FAR, t));
  mountains(NEARP, .28, t, key(NEAR, t));
  // brilho verde atrás da bandeira
  const gg = eio(seg(t, 12.6, 14));
  if (gg > 0) {
    const fx = FLAGX - X(t) + 85, gr = ctx.createRadialGradient(fx, 500, 10, fx, 500, 280);
    gr.addColorStop(0, `rgba(47,212,122,${.38 * gg})`); gr.addColorStop(1, 'rgba(47,212,122,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 150, W, GY - 150);
  }
  // chão
  const gc = mix('#1a150f', '#3d2d1e', d), gd = ctx.createLinearGradient(0, GY, 0, H);
  gd.addColorStop(0, gc); gd.addColorStop(.88, '#000'); gd.addColorStop(1, '#000');
  ctx.fillStyle = gd; ctx.fillRect(-20, GY, W + 40, H - GY + 20);
  const xo = X(t);
  if (d > 0) { ctx.fillStyle = `rgba(20,13,8,${.55 * d})`; for (const p of SPOTS) { const x = p.x - xo; if (x > -30 && x < W + 30) { ctx.beginPath(); ctx.ellipse(x, p.y, p.rx, p.ry, 0, 0, 7); ctx.fill(); } } }
  for (const p of PEBS) { const x = p.x - xo; if (x < -5 || x > W + 5) continue; const c = Math.round(p.g * (1 + d * .3)); ctx.fillStyle = `rgb(${c},${c},${c + 4})`; ctx.beginPath(); ctx.ellipse(x, p.y, p.r * 1.3, p.r, 0, 0, 7); ctx.fill(); }
  ctx.strokeStyle = '#0a0806'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (const q of TUFTS) { const x = q.x - xo; if (x < -10 || x > W + 10) continue; for (let k = 0; k < q.n; k++) { ctx.beginPath(); ctx.moveTo(x + k * 3, GY + 1); ctx.lineTo(x + k * 3 + (k - 1) * 2.5, GY - q.h + k * 2); ctx.stroke(); } }
}

// ---------- texto nos materiais ----------
function label(txt, cx, cy, maxW, col, size = 20) {
  ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let s = size; ctx.font = `700 ${s}px Inter`;
  const words = txt.split(' ');
  if (ctx.measureText(txt).width <= maxW || words.length === 1) {
    while (ctx.measureText(txt).width > maxW && s > 10) { s--; ctx.font = `700 ${s}px Inter`; }
    ctx.fillText(txt, cx, cy); return;
  }
  while (Math.max(...words.map(w => ctx.measureText(w).width)) > maxW && s > 10) { s--; ctx.font = `700 ${s}px Inter`; }
  words.forEach((w, i) => ctx.fillText(w, cx, cy + (i - (words.length - 1) / 2) * s * 1.15));
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function drawWall(i, x, t) {
  const wl = WALLS[i], y = GY - wl.h, name = F.muros[i];
  if (wl.type === 'wood') {
    ctx.fillStyle = '#8a5530'; ctx.fillRect(x + 10, y, 18, wl.h); ctx.fillRect(x + wl.w - 28, y, 18, wl.h);
    for (let k = 0; k < 4; k++) {
      const py = y + 18 + k * 42; ctx.fillStyle = '#a46a3b'; rrect(x - 4, py, wl.w + 8, 28, 3); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(x - 4, py + 24, wl.w + 8, 4);
      ctx.fillStyle = '#4a2c16'; for (const nx of [x + 19, x + wl.w - 19]) { ctx.beginPath(); ctx.arc(nx, py + 8, 2.2, 0, 7); ctx.arc(nx, py + 20, 2.2, 0, 7); ctx.fill(); }
    }
    label(name, x + wl.w / 2, y + 18 + 2 * 42 + 14, wl.w - 16, '#fbe9d6', 22);
  } else if (wl.type === 'brick') {
    ctx.fillStyle = '#d9a99a'; ctx.fillRect(x, y, wl.w, wl.h);
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, wl.w, wl.h); ctx.clip();
    const bh = 18.5, bw = 34;
    for (let r = 0; r * bh < wl.h; r++) for (let c = -1; c * bw < wl.w + bw; c++) {
      const bx = x + c * bw + (r % 2 ? bw / 2 : 0) + 2, by = y + r * bh + 2;
      ctx.fillStyle = (r * 7 + c * 3) % 5 === 0 ? '#9a3627' : '#a63d2c'; ctx.fillRect(bx, by, bw - 4, bh - 4);
    }
    ctx.restore(); label(name, x + wl.w / 2, y + wl.h * .45, wl.w - 14, '#ffffff', 25);
  } else if (wl.type === 'glass') {
    ctx.fillStyle = '#c8d0da'; ctx.fillRect(x, y, wl.w, wl.h);
    ctx.fillStyle = '#1c2838'; ctx.fillRect(x + 9, y + 9, wl.w - 18, wl.h - 18);
    ctx.save(); ctx.beginPath(); ctx.rect(x + 9, y + 9, wl.w - 18, wl.h - 18); ctx.clip();
    ctx.strokeStyle = 'rgba(220,235,255,.22)'; ctx.lineWidth = 14; ctx.beginPath(); ctx.moveTo(x + 10, y + 120); ctx.lineTo(x + 120, y + 10); ctx.stroke();
    ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(x + 40, y + 150); ctx.lineTo(x + 150, y + 40); ctx.stroke(); ctx.restore();

}
const VIG = (() => { const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d'); const g = x.createRadialGradient(W / 2, H / 2, H * .28, W / 2, H / 2, H * .75); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.3)'); x.fillStyle = g; x.fillRect(0, 0, W, H); return c; })();
const GRAIN = Array.from({ length: 24 }, (_, k) => { const c = document.createElement('canvas'); c.width = 360; c.height = 640; const x = c.getContext('2d'), d = x.createImageData(360, 640), r = rng(1000 + k); for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); return c; });

// ---------- quadro ----------
function draw(t) {
  const fi = Math.round(t * FPS * 4);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const [sx, sy] = shake(t, fi); ctx.translate(sx, sy);
  background(t);
  const xo = X(t);
  for (let i = 0; i < 3; i++) { const wl = WALLS[i]; if (t < wl.hit + .02) { const x = wl.wx - xo; if (x < W + 10 && x + wl.w > -10) drawWall(i, x, t); } }
  const x4 = WALLS[3].wx - xo;
  if (t < 9.9) { if (x4 < W + 10) { drawWall(3, x4, t); drawCracks(x4, t); } } else drawCubes(x4, t);
  drawFlag(t);
  drawDebris(t);
  const f = figure(t);
  drawFigure(f, t);
  drawSparks(t);
  effects(t, f, fi);
  flash(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  captions(t);
  ctx.drawImage(VIG, 0, 0);
  ctx.globalAlpha = .05; ctx.drawImage(GRAIN[Math.floor(t * 24) % 24], 0, 0, W, H); ctx.globalAlpha = 1;
}
window.seek = t => draw(clamp(t, 0, DUR));
// motion blur: mistura 2 subquadros (±0,25 de quadro)
const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H;
window.renderFrame = (i, q = .92) => {
  const t = i / FPS, d = .25 / FPS;
  draw(clamp(t - d, 0, DUR)); tmp.getContext('2d').drawImage(cv, 0, 0);
  draw(clamp(t + d, 0, DUR)); ctx.globalAlpha = .5; ctx.drawImage(tmp, 0, 0); ctx.globalAlpha = 1;
  return cv.toDataURL('image/jpeg', q).split(',')[1];
};
window.ready = document.fonts.load('700 37px Inter').then(() => document.fonts.ready).then(() => { draw(0); return true; });
</script></body></html>
